# Full GENOMETRICS stack: Postgres + API + nginx (Angular SPA).
#
# Local build (na raiz do repo):
#   docker compose up --build -d
#
# Demo SQL is not in git — optional compose.override.yaml (see compose.override.example.yaml)
#
# Alternativa:
#   cd docker && docker compose -f ../compose.yaml up --build -d
#
# Pull from GHCR (after merge to prod):
#   export GENOMETRICS_API_IMAGE=ghcr.io/<owner>/genometrics-project/api:latest
#   export GENOMETRICS_FRONTEND_IMAGE=ghcr.io/<owner>/genometrics-project/frontend:latest
#   cd docker && docker compose pull && docker compose up -d
#
# UI: http://localhost:4200  (nginx proxies /api to the API container)

services:
  postgres:
    image: postgres:16-alpine
    container_name: ngs-postgres
    environment:
      POSTGRES_DB: ngs
      POSTGRES_USER: ngs
      POSTGRES_PASSWORD: ngs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ngs -d ngs"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: ${GENOMETRICS_API_IMAGE:-genometrics-api:local}
    container_name: ngs-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ngs
      SPRING_DATASOURCE_USERNAME: ngs
      SPRING_DATASOURCE_PASSWORD: ngs
      NGS_STORAGE_LOCAL_DIR: /data/uploads
      NGS_JWT_SECRET: ${NGS_JWT_SECRET:-change-me-ngs-analytics-platform-jwt-secret-key-32bytes-min}
      NGS_AUTH_DISABLED: ${NGS_AUTH_DISABLED:-true}
      NGS_AI_ENABLED: ${NGS_AI_ENABLED:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: ${GENOMETRICS_FRONTEND_IMAGE:-genometrics-frontend:local}
    container_name: ngs-frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  uploads_data:
