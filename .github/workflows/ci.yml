name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [develop, main]
  push:
    branches: [develop, 'feature/**', 'fix/**', 'hotfix/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

jobs:
  from-release-line:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce develop then main
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$BASE_REF" = "develop" ]; then
            case "$HEAD_REF" in
              feature/*|fix/*|hotfix/*)
                echo "OK: $HEAD_REF -> develop"
                ;;
              *)
                echo "develop is the integration branch. Open the PR from feature/*, fix/* or hotfix/* (got: ${HEAD_REF:-empty})"
                exit 1
                ;;
            esac
          elif [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ]; then
              echo "main is production. Promote only from develop after CI passed (got: ${HEAD_REF:-empty} -> main)"
              exit 1
            fi
            echo "OK: develop -> main"
          else
            echo "Unexpected target: $BASE_REF"
            exit 1
          fi

  backend:
    if: >
      (github.event_name == 'push'
        || github.event.action != 'closed'
        || github.event.pull_request.merged == true)
      && (github.event_name == 'push'
        || (github.base_ref == 'develop'
          && (startsWith(github.head_ref, 'feature/')
            || startsWith(github.head_ref, 'fix/')
            || startsWith(github.head_ref, 'hotfix/')))
        || (github.base_ref == 'main' && github.head_ref == 'develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn -B test
      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

  frontend:
    if: >
      (github.event_name == 'push'
        || github.event.action != 'closed'
        || github.event.pull_request.merged == true)
      && (github.event_name == 'push'
        || (github.base_ref == 'develop'
          && (startsWith(github.head_ref, 'feature/')
            || startsWith(github.head_ref, 'fix/')
            || startsWith(github.head_ref, 'hotfix/')))
        || (github.base_ref == 'main' && github.head_ref == 'develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

  e2e:
    if: >
      (github.event_name == 'push'
        || github.event.action != 'closed'
        || github.event.pull_request.merged == true)
      && (github.event_name == 'push'
        || (github.base_ref == 'develop'
          && (startsWith(github.head_ref, 'feature/')
            || startsWith(github.head_ref, 'fix/')
            || startsWith(github.head_ref, 'hotfix/')))
        || (github.base_ref == 'main' && github.head_ref == 'develop'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: cypress-io/github-action@v6
        with:
          working-directory: frontend
          start: npm start
          wait-on: http://localhost:4200
          browser: chrome

  docker:
    needs: [backend, frontend, e2e]
    if: >
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.base_ref == 'main'
      && github.head_ref == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build API jar
        working-directory: backend
        run: mvn -B -DskipTests package
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: image
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "latest=ghcr.io/${repo}/api:latest" >> "$GITHUB_OUTPUT"
          echo "sha=ghcr.io/${repo}/api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.image.outputs.latest }}
            ${{ steps.image.outputs.sha }}
