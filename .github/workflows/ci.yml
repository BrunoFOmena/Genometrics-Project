name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'fix/**', 'hotfix/**']

# Least privilege by default.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn -B test
      - name: Package backend
        working-directory: backend
        run: mvn -B -DskipTests package

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint and test the Python core
        working-directory: python
        run: |
          uv run ruff check
          uv run ruff format --check
          uv run pytest

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: One-command demo (API + fixtures + MCP check)
        run: ./scripts/demo.sh
      - name: API log on failure
        if: failure()
        run: tail -n 200 data/api.log || true
