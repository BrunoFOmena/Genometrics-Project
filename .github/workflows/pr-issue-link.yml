name: PR issue link

# Every PR must close an issue (Closes #N) so the PR is linked to it and closes it on merge.
# Reads only the PR body (no checkout, no secrets): safe for fork PRs.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions: {}

jobs:
  issue-link:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require closing keyword
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(#|https://github\.com/[^[:space:]/]+/[^[:space:]/]+/issues/)[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::PR body must link an issue, e.g. 'Closes #123'. See CONTRIBUTING.md#issues-priorities-and-prs"
            exit 1
          fi
