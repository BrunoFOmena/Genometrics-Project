name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should GENOMETRICS do? Mention file formats, tools or agent workflows involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: impact
    attributes:
      label: Suggested priority
      description: The maintainer sets the final P0/P1/P2 label (see CONTRIBUTING.md).
      options:
        - "P0: blocks other planned work"
        - "P1: important, next on the roadmap"
        - "P2: nice to have"
  - type: checkboxes
    id: data
    attributes:
      label: Data policy
      options:
        - label: This request contains no real patient/participant data.
          required: true
