# Default for local/Cloud Agents (no Postgres required).
#   mvn spring-boot:run
#   mvn spring-boot:run "-Dspring-boot.run.profiles=dev-h2"
spring:
  datasource:
    url: jdbc:h2:file:../data/ngs-h2;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true

ngs:
  auth:
    disabled: true
  storage:
    local-dir: ../data/uploads

# Local-only by default (auth is off and the H2 console is on). Override with SERVER_ADDRESS=0.0.0.0 at your own risk.
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
